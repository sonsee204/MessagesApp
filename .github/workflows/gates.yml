# Workflow kiểm tra Quality Gates tự động trên GitHub Actions cho dự án appmessaging
# Mục đích: Đảm bảo toàn bộ quy chuẩn mã nguồn (bans, size-gate, type-check, tests, ocr) được thi hành tự động khi tạo PR vào nhánh main
name: Quality Gates

# Kích hoạt khi có Pull Request trỏ vào nhánh main hoặc kích hoạt thủ công (workflow_dispatch)
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality-audit:
    name: Kiểm tra toàn diện Quality Gates
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy toàn bộ lịch sử git (fetch-depth: 0) để phục vụ việc tính toán git diff chính xác giữa các commits/branches
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bước 2: Thiết lập môi trường Node.js phiên bản 20 và kích hoạt cache cho dependencies npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      # Bước 3: Cài đặt dependencies cho backend từ package-lock.json (npm ci sạch và tái lập chính xác)
      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      # Bước 4: Cài đặt dependencies cho frontend từ package-lock.json
      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      # Bước 5: Kiểm tra các quy tắc cấm tuyệt đối (diff-bans) trong diff (ví dụ: type any, @ts-ignore)
      - name: Run diff-bans Gate
        run: node scripts/gates/diff-bans.mjs

      # Bước 6: Kiểm soát kích thước tệp tin hiệu dụng (size-gate) cho cả frontend và backend ở chế độ nghiêm ngặt (strict)
      - name: Run size-gate (Frontend & Backend)
        run: |
          npm --prefix frontend run size-gate:strict
          node scripts/gates/size-gate.mjs --src backend/src --baseline backend/size-gate-baseline.json --strict

      # Bước 7: Kiểm tra kiểu dữ liệu TypeScript (tsc-gate) cho toàn bộ backend và frontend
      - name: Run Type-Check (tsc-gate)
        run: node scripts/gates/tsc-gate.mjs

      # Bước 8: Chạy kiểm thử tự động cho các module bị ảnh hưởng bởi thay đổi (affected-tests)
      - name: Run Tests (affected-tests)
        run: node scripts/gates/affected-tests.mjs

      # Bước 9: React Doctor — chỉ chạy khi diff chạm frontend/src (rule frontend.md §6)
      - name: Run React Doctor (Frontend only)
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^frontend/src/.*\.(ts|tsx)$'; then
            npm --prefix frontend run react-doctor
          else
            echo "Bỏ qua React Doctor: diff không chạm frontend/src/"
          fi

      # Bước 10: Xem trước ủy quyền code review tự động (ocr-gate preview) theo chuẩn kiểm tra mã nguồn
      - name: Run Open-Code-Review Delegation Preview
        run: node scripts/gates/ocr-gate.mjs